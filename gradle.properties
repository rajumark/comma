POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/rajumark/comma
POM_LICENSE_NAME=Hoverfly Community License 1.0
POM_LICENSE_URL=https://github.com/rajumark/comma/blob/main/LICENSE
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/rajumark/comma
POM_SCM_CONNECTION=scm:git:git://github.com/rajumark/comma.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/rajumark/comma.git
